[project]
name = "cyberbrick-esc"
version = "0.1.0"
description = "Stock MicroPython CyberBrick ESC proof of concept"
requires-python = ">=3.11"
dependencies = [
    "mpremote>=1.26,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["micropython/lib"]
